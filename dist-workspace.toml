[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.7"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax).
# aarch64-unknown-linux-gnu dropped: prebuilt ONNX Runtime for ARM is built
# against a newer libstdc++ than the runner image has → libort_sys fails to link.
# x86_64-apple-darwin dropped: no longer supporting Intel Macs.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Link against the dynamic CRT on Windows. The prebuilt ONNX Runtime expects
# msvcrt/ucrt (dynamic); with the default static CRT, libort_sys produces dozens
# of unresolved __imp_strtof / __imp_iswalpha / etc. linker errors.
msvc-crt-static = false

# cargo-dist 0.28.7 defaults aarch64-apple-darwin to macos-13 (Intel) which
# cross-compiles slowly and has a heavily backed-up runner queue. macos-14 is
# Apple Silicon native — native build, much shorter queue.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
