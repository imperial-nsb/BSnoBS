name: Release

# Runs whenever you push a tag like "v1.0.0"
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub releases

jobs:
  # ── macOS — Apple Silicon only, .app → .dmg via package-mac.sh ─────────────
  release-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build .app + .dmg
        run: ./package-mac.sh

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BSnoBS.dmg

  # ── Windows — zip with .exe ──────────────────────────────────────────────
  release-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path target\release\bsnobs.exe `
            -DestinationPath dist\bsnobs-windows.zip

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bsnobs-windows.zip

  # ── Linux — tar.gz ────────────────────────────────────────────────────────
  release-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package tar.gz
        run: |
          mkdir -p dist/bsnobs-linux
          cp target/release/bsnobs dist/bsnobs-linux/
          tar -czf dist/bsnobs-linux.tar.gz -C dist bsnobs-linux

      - name: Upload tar.gz to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bsnobs-linux.tar.gz
