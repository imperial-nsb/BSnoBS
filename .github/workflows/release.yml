name: Release

# Runs whenever you push a tag like "v1.0.0"
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub releases

# ── macOS — universal binary (.app → .dmg) ──────────────────────────────────
jobs:
  release-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build for x86_64 (Intel)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for aarch64 (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Combine into universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/x86_64-apple-darwin/release/bsnobs \
            target/aarch64-apple-darwin/release/bsnobs \
            -output universal/bsnobs

      - name: Assemble .app bundle
        run: |
          APP_NAME="BSnoBS"
          APP="dist/${APP_NAME}.app/Contents"
          mkdir -p "${APP}/MacOS" "${APP}/Resources"
          cp universal/bsnobs "${APP}/MacOS/bsnobs"
          cp Info.plist       "${APP}/Info.plist"

          if [ -f icon.png ]; then
            ICONSET="$(mktemp -d)/icon.iconset"
            mkdir -p "${ICONSET}"
            sips -z 16   16   icon.png --out "${ICONSET}/icon_16x16.png"      >/dev/null
            sips -z 32   32   icon.png --out "${ICONSET}/icon_16x16@2x.png"   >/dev/null
            sips -z 32   32   icon.png --out "${ICONSET}/icon_32x32.png"       >/dev/null
            sips -z 64   64   icon.png --out "${ICONSET}/icon_32x32@2x.png"   >/dev/null
            sips -z 128  128  icon.png --out "${ICONSET}/icon_128x128.png"     >/dev/null
            sips -z 256  256  icon.png --out "${ICONSET}/icon_128x128@2x.png" >/dev/null
            sips -z 256  256  icon.png --out "${ICONSET}/icon_256x256.png"     >/dev/null
            sips -z 512  512  icon.png --out "${ICONSET}/icon_256x256@2x.png" >/dev/null
            sips -z 512  512  icon.png --out "${ICONSET}/icon_512x512.png"     >/dev/null
            sips -z 1024 1024 icon.png --out "${ICONSET}/icon_512x512@2x.png" >/dev/null
            iconutil -c icns "${ICONSET}" -o "${APP}/Resources/icon.icns"
          fi

      - name: Create DMG
        run: |
          brew install create-dmg
          # create-dmg exits 2 for unsigned-app warnings — that's fine here
          create-dmg \
            --volname "BSnoBS" \
            --window-pos 200 100 \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "BSnoBS.app" 140 180 \
            --hide-extension "BSnoBS.app" \
            --app-drop-link 400 180 \
            dist/BSnoBS.dmg \
            dist/ || [ $? -eq 2 ]

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BSnoBS.dmg

  # ── Windows — zip with .exe ──────────────────────────────────────────────
  release-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path target\release\bsnobs.exe `
            -DestinationPath dist\bsnobs-windows.zip

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bsnobs-windows.zip

  # ── Linux — tar.gz ────────────────────────────────────────────────────────
  release-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package tar.gz
        run: |
          mkdir -p dist/bsnobs-linux
          cp target/release/bsnobs dist/bsnobs-linux/
          tar -czf dist/bsnobs-linux.tar.gz -C dist bsnobs-linux

      - name: Upload tar.gz to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bsnobs-linux.tar.gz
