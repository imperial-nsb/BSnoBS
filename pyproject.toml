[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsnobs"
version = "0.1.0"
description = "BSnoBS — BubSize no BS. Microbubble sizing from optical microscopy with a tiny YOLO student. CLI + PySide6 GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-image>=0.19",
    "imagecodecs>=2023.0",
    "tifffile>=2022.8",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
    "rich>=13.0",
    "typer>=0.9",
    "ultralytics>=8.3",
    "PySide6>=6.6",
]

[project.scripts]
bsnobs = "bsnobs.cli:main"
bsnobs-gui = "bsnobs.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bsnobs*"]

[tool.setuptools.package-data]
bsnobs = ["models/*.pt"]
