[package]
name = "bsnobs"
version = "0.2.1"
edition = "2021"
description = "BSnoBS — BubSize no BS. Microbubble sizing from optical microscopy (YOLO + ONNX Runtime)."
repository = "https://github.com/imperial-nsb/BSnoBS"
license = "MIT"

[[bin]]
name = "bsnobs"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
ndarray = "0.16"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
walkdir = "2"
log = "0.4"
env_logger = "0.11"
imageproc = { version = "0.26", default-features = false, features = ["text"] }
ab_glyph = "0.2"
axoupdater = { version = "0.10", default-features = false, features = ["blocking", "github_releases"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "ndarray", "coreml"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "ndarray"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
